services:
    backend:
        build: .
        ports:
            - "3000:3000"
        restart: always
        depends_on:
            - db
        environment:
            - NODE_ENV=release
        networks:
            fokin_network:
                ipv4_address: 192.168.3.60
    db:
        image: mongodb/mongodb-community-server
        ports:
            - "27020:27017"
        volumes:
            - fokin_mongodb_data:/data/db
            - fokin_mongodb_config:/data/configdb

volumes:
    fokin_mongodb_data:
    fokin_mongodb_config:

networks:
    fokin_network:
        ipam:
            driver: default
            config:
                - subnet: "192.168.3.0/24"